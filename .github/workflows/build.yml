name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      task:
        description: "debug / keystore / release"
        type: choice
        options: [debug, keystore, release]
        default: debug
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate project
        run: |
          if [ -f ExamMaker.zip ]; then
            rm -rf _p && mkdir _p && unzip -q ExamMaker.zip -d _p
            echo "PROJ=$(realpath "$(dirname "$(find _p -path '*ci/run.sh' | head -1)")/..")" >> "$GITHUB_ENV"
          else
            echo "PROJ=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        env:
          TASK: ${{ inputs.task || 'debug' }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: bash "$PROJ/ci/run.sh"
      - uses: actions/upload-artifact@v4
        with:
          name: ExamMaker-${{ inputs.task || 'debug' }}
          path: ${{ env.PROJ }}/out/*
